<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroForo | NASA</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0b0d17; }
        .card { background-color: #161b33; border-color: #2a3256; transition: 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #0d6efd; }
        .card-img-top { height: 200px; object-fit: cover; background: #000; }
        .resumen { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        /* Estilo para que los enlaces dentro de la explicación de la NASA se vean bien */
        #modalExplanation a { color: #38bdf8; text-decoration: none; }
        #modalExplanation a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-rocket-takeoff-fill text-primary me-2"></i>AstroForo <small class="text-secondary fw-normal">| NASA API</small>
            </a>
            <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="mostrarNoticias(true)">
                <i class="bi bi-shuffle me-1"></i> Explorar nuevas noticias
            </button>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container py-4">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-white">Debate sobre el Cosmos</h1>
            <p class="text-secondary">Noticias reales desde la NASA. Entra a cualquier hilo, da "Me gusta" y comenta.</p>
        </div>

        <!-- Indicador de carga -->
        <div id="loader" class="text-center my-5">
            <div class="spinner-border text-primary"></div>
            <p class="text-secondary mt-2">Cargando noticias espaciales...</p>
        </div>

        <!-- Grilla donde se insertan las tarjetas -->
        <div id="gridForo" class="row g-4"></div>
    </main>

    <!-- Modal del Hilo de Discusión -->
    <div class="modal fade" id="modalForo" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold text-white" id="modalTitle"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body">
                    <img id="modalImg" class="img-fluid rounded w-100 mb-3" style="max-height: 400px; object-fit: contain; background: #000;">
                    <p class="text-secondary small mb-2" id="modalDate"></p>
                    
                    <!-- Aquí se inyecta el HTML limpio y funcional de la NASA -->
                    <div id="modalExplanation" class="p-3 rounded bg-black bg-opacity-50 text-light mb-4 small lh-lg"></div>
                    
                    <h6 class="fw-bold text-primary mb-3"><i class="bi bi-chat-dots-fill me-2"></i>Comentarios de la Comunidad</h6>
                    <div id="listaComentarios" class="mb-3 d-flex flex-column gap-2"></div>

                    <!-- Formulario para comentar -->
                    <form id="formComentario" class="d-flex gap-2">
                        <input type="text" id="inputUsuario" class="form-control form-control-sm w-25" placeholder="Tu nombre" required>
                        <input type="text" id="inputTexto" class="form-control form-control-sm" placeholder="Escribe tu opinión..." required>
                        <button type="submit" class="btn btn-primary btn-sm px-3">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. CONFIGURACIÓN Y VARIABLES GLOBALES
        const API_URL = 'https://science.nasa.gov/wp-json/wp/v2/apod-basic/?api_key=5Nhc3elhKbG4mcKvHPB4AFgSU2619giaCZoisxF4';
        let noticias = [];
        let noticiaActualId = null;
        let datosForo = JSON.parse(localStorage.getItem('datos_foro_nasa')) || {};
        const modal = new bootstrap.Modal(document.getElementById('modalForo'));

        // Función auxiliar para quitar etiquetas HTML en el resumen de las tarjetas
        function limpiarHTML(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return temp.textContent || temp.innerText || '';
        }

        // 2. DESCARGAR DATOS DE LA NASA
        async function cargarAPI() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                // Guardamos solo las noticias válidas que tengan imagen
                noticias = data.filter(n => n.title && n.title !== 'NASA Science' && n.hdurl);
                mostrarNoticias();
            } catch (error) {
                document.getElementById('loader').innerHTML = '<p class="text-danger">Error al conectar con la NASA.</p>';
            }
        }

        // 3. PINTAR LAS 6 TARJETAS EN PANTALLA
        function mostrarNoticias(barajar = false) {
            document.getElementById('loader').classList.add('d-none');
            const grid = document.getElementById('gridForo');
            grid.innerHTML = '';

            if (barajar) noticias.sort(() => 0.5 - Math.random());

            noticias.slice(0, 6).forEach(item => {
                // Inicializar datos en el foro si no existen para esta fecha
                if (!datosForo[item.date]) datosForo[item.date] = { likes: 0, comentarios: [] };
                const info = datosForo[item.date];
                const textoPlano = limpiarHTML(item.explanation);

                grid.innerHTML += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100">
                            <img src="${item.hdurl}" class="card-img-top" alt="${item.title}">
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-secondary align-self-start mb-2">${item.date}</span>
                                <h5 class="card-title text-white fw-bold">${item.title}</h5>
                                <p class="card-text text-secondary small resumen flex-grow-1">${textoPlano}</p>
                                
                                <div class="d-flex justify-content-between mt-3 pt-2 border-top border-secondary border-opacity-25">
                                    <button class="btn btn-sm btn-outline-danger" onclick="darLike('${item.date}')">
                                        <i class="bi bi-heart-fill me-1"></i> <span id="likes-${item.date}">${info.likes}</span>
                                    </button>
                                    <button class="btn btn-sm btn-primary" onclick="abrirHilo('${item.date}')">
                                        <i class="bi bi-chat-text me-1"></i> Debatir (<span id="cant-${item.date}">${info.comentarios.length}</span>)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 4. DAR "ME GUSTA"
        function darLike(fechaId) {
            datosForo[fechaId].likes++;
            localStorage.setItem('datos_foro_nasa', JSON.stringify(datosForo));
            document.getElementById(`likes-${fechaId}`).textContent = datosForo[fechaId].likes;
        }

        // 5. ABRIR EL MODAL Y GESTIONAR COMENTARIOS
        function abrirHilo(fechaId) {
            noticiaActualId = fechaId;
            const item = noticias.find(n => n.date === fechaId);

            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalImg').src = item.hdurl;
            document.getElementById('modalDate').textContent = `Publicado el: ${item.date}`;
            
            // Usamos innerHTML para que las etiquetas <strong> y <a> se vean formateadas y sin errores
            document.getElementById('modalExplanation').innerHTML = item.explanation;
            
            // Forzar que los enlaces dentro del texto de la NASA se abran en otra pestaña
            document.querySelectorAll('#modalExplanation a').forEach(a => a.target = '_blank');

            pintarComentarios();
            modal.show();
        }

        function pintarComentarios() {
            const lista = document.getElementById('listaComentarios');
            const comentarios = datosForo[noticiaActualId].comentarios;
            
            if (comentarios.length === 0) {
                lista.innerHTML = '<p class="text-secondary small fst-italic">No hay comentarios aún. ¡Sé el primero!</p>';
                return;
            }

            lista.innerHTML = comentarios.map(c => `
                <div class="p-2 rounded bg-secondary bg-opacity-10 border-start border-primary border-3">
                    <strong class="text-info small">${c.usuario}:</strong>
                    <span class="text-light small ms-1">${c.texto}</span>
                </div>
            `).join('');
        }

        // Guardar nuevo comentario
        document.getElementById('formComentario').addEventListener('submit', (e) => {
            e.preventDefault();
            const usuario = document.getElementById('inputUsuario').value;
            const texto = document.getElementById('inputTexto').value;

            datosForo[noticiaActualId].comentarios.push({ usuario, texto });
            localStorage.setItem('datos_foro_nasa', JSON.stringify(datosForo));

            document.getElementById('inputTexto').value = '';
            pintarComentarios();
            document.getElementById(`cant-${noticiaActualId}`).textContent = datosForo[noticiaActualId].comentarios.length;
        });

        // Iniciar la app
        cargarAPI();
    </script>
</body>
</html>
